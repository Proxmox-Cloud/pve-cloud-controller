[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pve-cloud-controller"
authors = [{ name = "Tobias Huebner", email = "tobias.huebner@vmzberlin.com" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]
dynamic = ["dependencies", "version"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
version = {attr = "pve_cloud_ctrl._version.__version__"}

[project.scripts]
ns-watcher = "pve_cloud_ctrl.ns_watcher:main"
pod-watcher = "pve_cloud_ctrl.pod_watcher:main"
adm = "pve_cloud_ctrl.adm:main"
cron = "pve_cloud_ctrl.cron:main"
mc-gw = "pve_cloud_ctrl.mc_gateway:main"
ext-ns-watcher = "pve_cloud_ctrl.ext_ns_watcher:main"
ext-cron = "pve_cloud_ctrl.ext_cron:main"
